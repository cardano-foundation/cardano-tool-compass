name: "Escrow"
description: "Escrow contract facilitates the secure exchange of assets between two parties by acting as a trusted intermediary that holds the assets until the conditions of the agreement are met. The escrow smart contract allows two parties to exchange assets securely. The contract holds the assets until both parties agree and sign off on the transaction."
url: "https://github.com/cardano-foundation/cardano-template-and-ecosystem-monitoring/blob/main/escrow/README.md"
